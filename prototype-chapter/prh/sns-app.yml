version: 1
# sns-app 教材の禁止表現辞書（G3 文体ゲート・自作分はこのファイルのみ）
# 12_文体・AI臭さ排除方針.md が正本。ここはその機械強制版。
#
# 節の番号は 12 §2.1 の表のカテゴリに対応する。
#   C1 誇大・煽り / C2 情緒・詩的 / C3 AI構文 / C4 英語直訳調 /
#   C5 関西弁・タメ口 / C6 記号（絵文字） / C7 不採用スタック名（13 §5）
# カテゴリごとの検知テストの結果は material/decisions/D8_文体検出器の実測と拡張.md にある。
#
# prh の正規表現について（実測。D8 §1）:
#   - prh は YAML の /.../ をフラグ無しで妥当か検証したうえで gmu を付けて再構築する。
#     よって /.../u と書くと文字列として扱われて壊れ、\u{...} は検証段階で落ちる。
#     絵文字の範囲は文字そのものを書く。
#   - m が付くので $ は行末を指す。話者行の閉じ括弧に $ を添えると、
#     文中のインライン引用（「実行する」ボタン）を巻き込まずに済む。

rules:
  # ---- C5-a 関西弁の混入（教材本文は標準語。会話文の「先生」も標準語） ----
  - expected: ていない
    pattern: /とらん|てへん|とんない/
    prh: 教材本文は標準語。関西弁は会話ログ用であり教材には出さない
  - expected: ですね
    pattern: /やね(?![ぇー])/
    prh: 教材本文は標準語
  - expected: ください
    pattern: /してや(?=[。、])/
    prh: 教材本文は標準語
  # 「〜へん」の否定形。直前が「の」のとき（そのへん・このへん）は方言ではないので外す。
  - expected: ません
    pattern: /(?<!の)へん(?:[。、！？!?]|[」』]$|かった|で|よ|わ|ねん|の)/
    prh: 関西弁の否定「〜へん」。「〜ません」に変更する
  # 語尾は句読点だけでなく行末の閉じ括弧でも終わる。12 §1.1 の話者行がその形。
  - expected: です
    pattern: /(?:やで|やな|ねん|やんか|やろ|せや|なんぼ|ちゃう|あかん)(?:[。、！？!?]|[」』]$)/
    prh: 関西弁の語尾。標準語の敬体に変更する
  # 断定の「〜や」。名詞のあとに来る形だけを見る（「日や」「もんや」）。
  - expected: です
    pattern: /(?:日|もん|こと|とこ|ん|の|ため|はず|話|とき)や(?:[。！？!?][」』]?|[」』])$/
    prh: 関西弁の断定「〜や」。「〜です」に変更する
  - expected: ですが
    pattern: /やけど(?:[、。！？!?]|[」』]$)/
    prh: 関西弁「やけど」。「ですが」に変更する
  - expected: からです
    pattern: /からや(?:[。！？!?]|[」』]$)/
    prh: 関西弁「からや」。「からです」に変更する
  - expected: だから
    pattern: /[せそ]やから/
    prh: 関西弁「せやから／そやから」
  - expected: とても
    pattern: /めっちゃ|ほんまに|ようけ/
    prh: 関西弁の副詞
  - expected: よい
    pattern: /ええ(?:で|ねん|わ|やろ|んちゃう)/
    prh: 関西弁「ええ〜」
  - expected: 私
    pattern: /ワイ(?![ヤ-ンー])/
    prh: 関西弁の一人称
  - expected: しまう
    pattern: /てもうた|てまう/
    prh: 関西弁「〜てもうた／〜てまう」

  # ---- C5-b 常体（タメ口）— 12 §2.1 が教材本文で全面禁止 ----
  # 敬体の「ます／です」は否定後読みで外す。「ましょう／でしょう」は「ょ」で外す。
  # 「3つ。」のような数詞つきの体言止めは数字を後読みに入れて外す。
  # 語尾は**行末**に限る。行の途中の終止形は、捨て試作の実測では
  # 動作の列挙（「書く、保存する、端末を見る。これの繰り返しです」chapter-live-reload.md:78）と
  # 太字ラベル（「**1行目を読む。**」chapter-expo-first-screen.md:145）が大半で、
  # 行途中まで拾うと 1 件の真陽性に対し 2 件の誤検知が出た（D8 §4）。
  # 取りこぼす形（「〜入っている。それだけ」chapter.md:10）は D8 §6 に残件として記録してある。
  - expected: 敬体（〜します／〜です）にする
    pattern: /(?<![までょ0-9０-９])[うくぐすずつぬふぶむる](?:[。！？!?][」』]?|[」』])$/
    prh: 常体（タメ口）の動詞終止形。教材本文は敬体（12 §2.1）
  - expected: 敬体（〜しました）にする
    pattern: /(?<!まし)(?<!でし)(?:た|[んっ]だ)(?:[。！？!?][」』]?|[」』])$/
    prh: 常体（タメ口）のタ形。教材本文は敬体（12 §2.1）
  - expected: 敬体（〜です／〜ありません）にする
    pattern: /(?:ない|よい|いい|多い|早い|速い|遅い|強い|弱い|近い|遠い|高い|安い|長い|短い|新しい|正しい|難しい|やさしい|うれしい|おかしい)(?:[。！？!?][」』]?|[」』])$/
    prh: 常体（タメ口）の形容詞終止形。教材本文は敬体（12 §2.1）
  - expected: です
    pattern: /(?:である|であった|だった|のだ|わけだ|なんだ)(?:[。！？!?][」』]?|[」』])$/
    prh: 常体（である調）。教材本文は敬体（12 §2.1）

  # ---- C1 誇大・煽り（12 §2.1 / 02 §2 で「誇大に言わない」と決めた方針の機械強制） ----
  - expected: $1
    pattern: /たった一行で(.+)/
    prh: 誇大表現。実際の手数を書く
  - expected: 簡単に
    pattern: /誰でも簡単に|一瞬で|あっという間に/
    prh: 誇大表現。読者の詰まりを否定する言い方を避ける
  - expected: そのまま動く
    pattern: /一行も直さずに動く|完全に同じコードで動く/
    prh: 過剰な約束。ネイティブ前提の箇所は手当てが要る（02 §2）
  - expected: 削除する
    pattern: /ついに|遂に|いよいよ/
    prh: 誇大・煽り。前振りで盛らない（12 §2.1）
  - expected: 削除する
    pattern: /真の(?:意味|実力|姿|力|スタート|SNS)/
    prh: 誇大・煽り。「真の〜」は使わない（12 §2.1）
  - expected: 実際の仕組みを書く
    pattern: /魔法/
    prh: 誇大表現。仕組みを説明せずに済ませない（12 §2.1）
  - expected: です
    pattern: /(?:日|とき|時|瞬間)です[！!]/
    prh: トレーラー調。「〜する日です！」の煽りを使わない（12 §2.1）
  - expected: 実測値を書く
    pattern: /圧倒的|劇的に|革命的|究極の|最強の|驚くほど|衝撃的|飛躍的/
    prh: 誇大表現。程度は実測値で書く（12 §2.1）

  # ---- C2 情緒・詩的（12 §2.1）----
  - expected: ためです
    pattern: /のだから/
    prh: 情緒的な言い回し。理由は「〜からです」で書く（12 §2.1）
  - expected: 削除する
    pattern: /気持ちいい|気持ちよい|気持ちが良い|心地よい/
    prh: 情緒表現。読者の感情を代弁しない（12 §2.1）
  - expected: 削除する
    pattern: /自慢し|誇ってよい|胸を張って/
    prh: 情緒表現。読者の感情を代弁しない（12 §2.1）
  - expected: 削除する
    pattern: /胸が熱|心が躍|わくわく|ワクワク|感動|感慨|しみじみ/
    prh: 情緒表現。教材本文は事実だけを書く（12 §2.1）
  - expected: 削除する
    pattern: /スタートライン|一歩を踏み出|学びの旅|旅が始ま|冒険/
    prh: 詩的な比喩。工程を具体的に書く（12 §2.1）

  # ---- C3 AI 構文（12 §2.1 の「AI臭さ」の代表パターン）----
  - expected: $1
    pattern: /それでは、(.+?)(?:して)?いきましょう/
    prh: AI構文。定型の前置きを削る
  - expected: $1
    pattern: /まとめると、(.+)/
    prh: AI構文。まとめ節を反射的に置かない
  - expected: $1
    pattern: /いかがでしたでしょうか。?(.*)/
    prh: AI構文。読者に感想を求める締めを使わない
  - expected: $1
    pattern: /本記事では、(.+)/
    prh: 「本記事」は教材の呼称として使わない（章・パートを使う）
  - expected: 重要
    pattern: /非常に重要|極めて重要/
    prh: 強調の水増し
  - expected: です
    pattern: /と言えるでしょう|と言えます|ではないでしょうか/
    prh: AI構文。断定を避ける言い回しを使わない（12 §2.1）
  - expected: 断定して書く
    pattern: /という点です|という点にあります/
    prh: AI構文「重要なのは〜という点です」（12 §2.1）
  - expected: 具体例を書く
    pattern: /さまざまな場面|様々な場面|多岐にわたり|幅広い場面/
    prh: AI構文。範囲をぼかさず具体例を書く
  - expected: 削除する
    pattern: /言うまでもあり|言うまでもなく|論を俟たない/
    prh: AI構文。読者の既知を仮定しない
  - expected: 具体項目を列挙する
    pattern: /あらゆる観点|様々な観点|多角的な観点/
    prh: AI構文。観点を数えて書く
  - expected: 何が分かるかを書く
    pattern: /重要な示唆|示唆に富/
    prh: AI構文。示唆ではなく結論を書く
  - expected: 何が分かったかを書く
    pattern: /浮き彫り/
    prh: AI構文。比喩ではなく事実を書く
  - expected: 削除する
    pattern: /注目に値|特筆すべき/
    prh: AI構文。強調の水増し
  - expected: だから
    pattern: /これにより|それにより/
    prh: AI構文。接続はやさしい語にする
  - expected: 本文から始める
    pattern: /結論から言うと|結論から述べると|ここでは.{0,20}について解説します/
    prh: AI構文。定型の前置きを削る

  # ---- C4 英語直訳調（12 §2.1）----
  # 「することができます」「することは可能です」は preset-ja-technical-writing の
  # ja-no-redundant-expression（dict1 / dict2）が拾う。あれは「する」に固定されていて
  # 「出すことができます」を拾わない（実測。D8 §2）ので、ここは「する」以外を担当する。
  # 二重報告を避けるため「する」を否定後読みで外してある。
  - expected: できます
    pattern: /(?<!する)ことができます|(?<!する)ことができました/
    prh: 直訳調。「〜できます」に変更する（12 §2.1）
  - expected: できます
    pattern: /(?<!する)ことは可能です|(?<!する)ことが可能です/
    prh: 直訳調。「〜できます」に変更する（12 §2.1）
  - expected: について
    pattern: /言及(?:し|す|さ)/
    prh: 直訳調。「〜について」「〜を紹介」に変更する
  - expected: も同じです
    pattern: /に関しても同様です|についても同様です/
    prh: 直訳調。「〜も同じです」に変更する
  - expected: 直接書く
    pattern: /を行うことで|を行った上で|に他なりません/
    prh: 直訳調。動詞を直接使う

  # ---- C6 記号（12 §2.1: 教材本文で絵文字禁止。強調は太字のみ）----
  # 範囲は文字そのもので書く（prh は \u{...} を受け付けない。D8 §1）。
  # 上段が BMP の外（＝絵文字の面。u フラグ下でのみ一致する）、下段が記号面（U+2600〜U+27BF, U+2B00〜U+2BFF）と
  # 異体字セレクタ（U+FE0F）。矢印（U+2190〜U+21FF）は絵文字ではないので入れない。
  - expected: 削除する（強調は太字のみ）
    pattern: /[^\x00-\uFFFF]/
    prh: 教材本文で絵文字は禁止（12 §2.1）
  - expected: 削除する（強調は太字のみ）
    pattern: /[☀-➿]|[⬀-⯿]|️/
    prh: 教材本文で絵文字・装飾記号は禁止（12 §2.1）

  # ---- C7 不採用スタック名の混入（13 §5 の方針同期チェックの機械強制） ----
  #      2026-07-26 の構成振り直しで不採用になった技術が本文に出たら FAIL
  - expected: Expo
    pattern: /Capacitor/
    prh: 不採用スタック。第1弾の教材本文には登場させない（02 §2）
  - expected: Supabase
    pattern: /NestJS|BullMQ|MinIO|Redis|Prisma/
    prh: 不採用スタック。第3弾の教材の題材（09）／13 §5 の対象語
  - expected: Supabase Auth
    pattern: /bcrypt/
    prh: パスワードのハッシュ化は Supabase の責務（01 §3）
  - expected: Expo Router
    pattern: /TanStack Router/
    prh: 不採用スタック。第2弾の教材の題材（09）
  - expected: Expo Go
    pattern: /Xcode|Android Studio/
    prh: 学習者に開発ツールのセットアップを要求しない（01 §4）
