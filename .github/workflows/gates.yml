name: gates

# 教材の機械ゲート（10_教材制作フロー.md §4）を CI で常設する。
#   G3 文体ゲート … textlint + preset-ja-technical-writing + prh辞書
#   G5 引用ゲート … embedmd。教材に貼ったコードが listings/ の実ファイルとズレていないか
#
# ★ embedmd -d の終了コードは 1 ではなく 2 である（実測。道具検証の記録 §3）。
#   スクリプト側で「非ゼロなら FAIL」として扱っているので、ここでは素直に呼ぶだけでよい。
#
# ★★ 2026-07-28 時点、このワークフローは走らない。
#   GitHub が「支払いに問題があるためジョブを開始できない」と返す。
#   非公開リポジトリの Actions は無料枠に上限があるため。
#   枠を増やす選択は取らない（`no-paid-infra-without-value`）。
#   当面はローカルで `npm run gate` を回し、その結果を PR 本文へ書く運用にする。
#   公開リポジトリにすれば無料枠で走るので、公開の可否が決まった時点で有効になる。
#   このファイルは消さない。設定は正しく、走る条件が揃っていないだけである。

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # embedmd は Go 製。この前提が抜けると G5 が永久に赤いままになる。
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: embedmd を入れる
        run: go install github.com/campoy/embedmd@latest

      - name: 捨て試作の依存を入れる
        working-directory: prototype-chapter
        run: npm ci || npm install

      - name: G3 文体ゲート
        working-directory: prototype-chapter
        run: npm run gate:style

      - name: G5 引用ゲート
        working-directory: prototype-chapter
        env:
          EMBEDMD: ${{ github.workspace }}/go/bin/embedmd
        run: |
          # setup-go は GOPATH を $HOME/go に置く。両方を見て解決する。
          if [ ! -x "$EMBEDMD" ]; then EMBEDMD="$(go env GOPATH)/bin/embedmd"; fi
          export EMBEDMD
          npm run gate:quote
