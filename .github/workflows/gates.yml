name: gates

# 教材の機械ゲート（10_教材制作フロー.md §4）を CI で常設する。
#   検査器の自己テスト … scripts/curriculum-qa/test_*.py を全部個別に走らせる。
#                        検査器が壊れていても検査器自身が「緑」と言わないようにするためのもの。
#   G3 … 文体（textlint + preset-ja-technical-writing + prh辞書）/
#         構造（コードブロック25行・段落3文）/ 方針同期（配布語彙・不採用スタック・人物名）/
#         開発ログの存在確認 / 開始状態混入検査
#   G4 … material/reviews/g4/ の受領証の機械検査（D15-8）
#   G5 … embedmd。教材に貼ったコードが listings/ の実ファイルとズレていないか
#   配布 … EPUB 同梱物・PDF リンク・未使用画像
#
# ★ 終了コード 3（未判定）は「その成果物がまだ存在しない」という意味で、
#   FAIL ではない（D1 §8-3: 対象0件を黙って緑にしない。開始状態・EPUB・
#   PDF・受領証・完成版アプリは現時点で未生成）。
#   読み替えは tools/gate-step.sh 1箇所で行う: 3 → 0 + ::warning title=未判定。
#   個別のステップに rc==3 の分岐を書かないこと（散らばると直し忘れる）。
#
# ★ 合否に数える走査対象は教材本文（curriculum/*.md）だけ。prototype-chapter/ は
#   教材本文ではない使い捨てフィクスチャ（10 L140-143）なので、構造と方針同期は
#   参考ステップで回すだけに留める。dev-log・開始状態は実章にだけ課す（D1-7）。
#
# ★ embedmd -d の終了コードは 1 ではなく 2 である（実測。道具検証の記録 §3）。
#   スクリプト側で「非ゼロなら FAIL」として扱っているので、ここでは素直に呼ぶだけでよい。
#
# ★★ 経緯（2026-07-28）: 非公開だった間、GitHub が
#   「支払いに問題があるためジョブを開始できない」と返して1度も走らなかった。
#   枠を増やす選択は取らなかった（`no-paid-infra-without-value`）。
#   **公開へ切り替えた後は走っている。同日に3回とも成功を観測した。**
#   よって現在このワークフローは有効であり、ローカル実行への退避は要らない。

on:
  push:
    branches: [main]
  pull_request:
    # 既定 types には ready_for_review が無い。draft から ready にした時に再走させる
    types: [opened, synchronize, reopened, ready_for_review]

# main push は run 毎に別グループにして取り消さない。PR だけ古い実行を捨てる
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  gates:
    # push は pull_request が null なので、== false ではなく != true で素通しにする
    if: github.event_name != 'pull_request' || github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # PR のベースSHAまで履歴を取る。浅い fetch だと G4 が差分の
          # 対象章を拾えない（pr-target-chapters.sh が 2 を返す）。
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # embedmd は Go 製。この前提が抜けると G5 が永久に赤いままになる。
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          # このリポジトリに Go の依存ファイルは無く、embedmd を1本入れるだけ。
          # 依存の取得結果を保存する仕組みを有効にしておく意味が無いので切る。
          cache: false

      - name: Shared CI entry contracts
        run: python3 scripts/ci/test_ci_entry.py

      - name: embedmd を入れる
        # 版を固定する。@latest だとリポジトリを1行も変えていないのに、
        # 向こうが新しい版を出した日から G5 の結果が変わりうる。
        # v1.0.0 は「差分ありのとき終了コード 2」を実測した版そのもの
        # （道具検証の記録 §3）。上げるときは同じ実測をやり直してから上げる。
        run: bash .github/ci/run.sh embedmd-install

      - name: 捨て試作の依存を入れる
        # npm ci だけを使う。npm install へ逃がすと、依存の固定ファイルが本文とズレていても
        # 実行環境の中だけで辻褄を合わせて通ってしまい、ズレたまま気づけなくなる。
        run: bash .github/ci/run.sh prototype-install

      # 検査器そのものの退行テスト。検査器が壊れていると「緑」が信じられないので
      # 一番先に置く。1本でも落ちたらそこで止める（後続の判定は意味をなさない）。
      - name: 検査器の自己テスト（test_*.py を個別に実行）
        run: bash .github/ci/run.sh qa-selftests

      - name: G3・G6 試作検査器の正負自己テスト（実走とは別）
        run: bash .github/ci/run.sh g3-g6-selftests

      - name: SDK57 候補のファイル整合と負例検査（正式採用とは別）
        run: bash .github/ci/run.sh sdk57-candidate

      - name: G6 broker schema tests and available OS probe（NON-FORMAL）
        run: bash .github/ci/run.sh broker-probes

      - name: Auth return receiver adversarial tests（NON-FORMAL; no native app claim）
        run: bash .github/ci/run.sh auth-receiver

      - name: SDK57 Auth app candidate tests and typecheck（NON-FORMAL）
        run: bash .github/ci/run.sh auth-sdk57

      - name: D4 predecessor candidate safety and shared-toolchain typecheck（NON-FORMAL）
        run: bash .github/ci/run.sh d4-predecessor-safety

      - name: D4 declared input, controller lease and chapter build（NON-FORMAL）
        run: bash .github/ci/run.sh d4-runtime

      - name: Full RLS chapter draft checks (not formal G3/G6)
        run: bash .github/ci/run.sh d4-heavy

      - name: Profile predecessor slice checks (not full SNS or G6)
        run: bash .github/ci/run.sh profile-predecessor
      # 既存の試作2章とG6対照版の回帰検査。curriculum/*.md の正式G3や
      # 凍結済みsnapshotの承認には代用しない。
      - name: G3 試作2章＋対照版の5検査（NON-FORMAL）
        run: bash .github/ci/run.sh g3-trial

      # G3（10 §4）の5検査。文体も対象が curriculum/*.md に変わったので
      # 教材本文が無い間は未判定（3）を返しうる → gate-step.sh 経由。
      - name: G3 文体チェック（textlint）
        if: ${{ !cancelled() }}
        run: bash .github/ci/run.sh material-style

      - name: G3 構造チェック（コードブロック25行・段落3文）
        if: ${{ !cancelled() }}
        run: bash .github/ci/run.sh material-structure

      - name: G3 方針同期チェック（配布語彙・不採用スタック・人物名）
        if: ${{ !cancelled() }}
        run: bash .github/ci/run.sh material-policy

      - name: G3 開発ログの存在確認
        if: ${{ !cancelled() }}
        run: bash .github/ci/run.sh material-dev-log

      - name: G3 開始状態混入検査
        if: ${{ !cancelled() }}
        run: bash .github/ci/run.sh material-start-state

      - name: G4 受領証の検査
        if: ${{ !cancelled() }}
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash .github/ci/run.sh material-receipts
      # 捨て試作は教材本文ではない（10 L140-143）。フィクスチャの指摘は
      # 執筆の参考情報なので ::warning に出すだけで、ジョブは落とさない。
      # dev-log・開始状態は実章にだけ課す検査なのでここでは回さない（D1-7）。
      - name: 捨て試作フィクスチャへの構造・方針同期・文体（参考。合否に数えない）
        if: ${{ !cancelled() }}
        run: bash .github/ci/run.sh fixture-reference

      - name: 配布物の検査（EPUB 参照・PDF リンク・未使用画像）
        if: ${{ !cancelled() }}
        run: bash .github/ci/run.sh distribution

      - name: G5 引用ゲート
        if: ${{ !cancelled() }}
        env:
          EMBEDMD: ${{ github.workspace }}/go/bin/embedmd
        run: bash .github/ci/run.sh quote
